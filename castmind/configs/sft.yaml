defaults:
  - sft_trainer_engine
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config
  run:
    dir: ${trainer.default_local_dir}/hydra
  job:
    chdir: false

model:
  path: ???
  enable_gradient_checkpointing: true
  use_remove_padding: true
  trust_remote_code: false

engine:
  strategy: fsdp2
  dtype: bfloat16
  model_dtype: bf16
  seed: 42
  use_torch_compile: false

optim:
  lr: 2.0e-5
  lr_scheduler_type: constant
  lr_warmup_steps_ratio: 0.0

# Length and device-local limits are runtime choices, not paper hyperparameters.
data:
  train_files: ???
  val_files: null
  train_batch_size: 32
  micro_batch_size_per_gpu: 1
  use_dynamic_bsz: true
  max_token_len_per_gpu: 17048
  max_length: 17048
  max_response_length: 2048
  truncation: error
  pad_mode: no_padding
  num_workers: 0
  custom_cls:
    path: ???
    name: PreparedSFTDataset

checkpoint:
  save_contents: [model, optimizer, extra, hf_model]
  load_contents: [model, optimizer, extra]

trainer:
  total_epochs: 3
  total_training_steps: null
  n_gpus_per_node: 4
  nnodes: 1
  seed: 42
  project_name: CastMind
  experiment_name: sft
  default_local_dir: ???
  logger: [console]
  save_freq: -1
  test_freq: -1
  resume_mode: disable
