defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config
  run:
    dir: ${trainer.default_local_dir}/hydra
  job:
    chdir: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

data:
  train_files: ???
  val_files: ???
  train_batch_size: 16
  max_prompt_length: 15000
  max_response_length: 2048
  truncation: error
  filter_overlong_prompts: false
  shuffle: true
  seed: 42
  dataloader_num_workers: 0
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: true
  custom_cls:
    path: ???
    name: PreparedRLHFDataset

actor_rollout_ref:
  model:
    path: ???
    trust_remote_code: false
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    use_torch_compile: false
    data_loader_seed: 42
    fsdp_config:
      model_dtype: bf16
      seed: 42
      param_offload: false
      optimizer_offload: false
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    use_torch_compile: false
    fsdp_config:
      model_dtype: bf16
      param_offload: true
  rollout:
    name: vllm
    engine_kwargs:
      vllm:
        seed: 42
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    max_model_len: 17048
    max_num_batched_tokens: 17048
    max_num_seqs: 128
    gpu_memory_utilization: 0.5
    enable_chunked_prefill: true
    enable_prefix_caching: true

reward:
  custom_reward_function:
    path: ???
    name: compute_score
  reward_manager:
    name: naive

trainer:
  total_epochs: 2
  total_training_steps: null
  n_gpus_per_node: 4
  nnodes: 1
  project_name: CastMind
  experiment_name: grpo
  default_local_dir: ???
  logger: [console]
  val_before_train: false
  save_freq: 250
  test_freq: -1
  resume_mode: disable
