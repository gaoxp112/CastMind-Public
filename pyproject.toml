[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castmind"
version = "0.1.0"
description = "Core supervised and GRPO training for evidence-grounded time series forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2",
  "pyarrow>=19",
  "PyYAML>=6",
  "omegaconf>=2.3",
  "hydra-core>=1.3,<2",
]

[project.optional-dependencies]
train = [
  "verl @ git+https://github.com/verl-project/verl.git@061053139d598cfc172fac10db610d91a61be3e7",
  "torch==2.10.0",
  "transformers==5.3.0",
  "vllm==0.18.1",
  "flash-attn==2.8.3",
  "flash-linear-attention==0.5.2",
  "sentence-transformers==5.3.0",
]
dev = ["pytest>=8", "build>=1"]
example = ["chronos-forecasting==2.3.2"]

[tool.setuptools.packages.find]
include = ["castmind*"]

[tool.setuptools.package-data]
castmind = ["prompt.txt", "configs/*.yaml"]
